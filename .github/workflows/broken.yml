name: site-check
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the readme
        run: cat README.md
      - name: Show the Python version
        run: pyhton3 --version
