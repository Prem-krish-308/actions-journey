name: download arti
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build pack
        run: echo "the package" > app.txt
      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download pack
        uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: check it arrived
        run: test -f app.txt
